        <aside class="bg-white rounded-3xl border border-slate-200 p-6 shadow-tech flex flex-col gap-5">
            <div>
                <h3 class="font-heading font-extrabold text-senac-blue text-lg">Sua lista de convidados</h3>
                <p class="text-xs text-slate-500 mt-2">Importe uma vez e continue sorteando quando quiser.</p>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="raffle-stat"><strong id="raffle-total">—</strong><span>Aptos</span></div>
                <div class="raffle-stat"><strong id="raffle-remaining">—</strong><span>Na disputa</span></div>
                <div class="raffle-stat"><strong id="raffle-count">—</strong><span>Sorteados</span></div>
            </div>
            <label class="raffle-upload" for="raffle-file">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-senac-orange" aria-hidden="true"></i>
                <strong class="block mt-3 text-sm text-senac-blue">Importar participantes</strong>
                <span class="block text-xs text-slate-500 mt-2">CSV ou XLSX · até 5 MB</span>
                <input type="file" id="raffle-file" accept=".csv,.xlsx" class="block w-full text-xs mt-4">
            </label>


            <div class="border-t border-slate-100 pt-4 space-y-3">
                <button type="button" id="raffle-reset" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold px-4 py-2.5 rounded-xl text-xs disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa-solid fa-rotate-left mr-1" aria-hidden="true"></i>Resetar sorteios
                </button>
                <p class="text-xs text-slate-500 leading-relaxed">Apaga o histórico de sorteados e libera todos os participantes da lista ativa para começar do zero.</p>
            </div>
            <p id="raffle-import-message" role="status" class="text-sm font-semibold text-senac-blue min-h-[1.5rem]"></p>
        </aside>
